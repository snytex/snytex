<svg width="600" height="310" viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .dim  { fill: #4b5263; }
    .white { fill: #abb2bf; }
    .blue  { fill: #61afef; }
    .green { fill: #98c379; }
    .yellow { fill: #e5c07b; }
    .purple { fill: #c678dd; }
    .red { fill: #e06c75; }
    .bold { font-weight: 700; }
  </style>

  <!-- background -->
  <rect width="600" height="310" rx="8" fill="#1e2127"/>

  <!-- user@host -->
  <text x="24" y="40" class="blue bold" font-size="14">snytex</text>
  <text x="80" y="40" class="white" font-size="14">@</text>
  <text x="92" y="40" class="blue bold" font-size="14">github</text>

  <!-- separator -->
  <text x="24" y="60" class="dim" font-size="14">─────────────────────────────────────────────</text>

  <!-- os -->
  <text x="24" y="84" class="purple bold" font-size="13">os</text>
  <text x="100" y="84" class="white" font-size="13">arch linux</text>

  <!-- editor -->
  <text x="24" y="106" class="purple bold" font-size="13">editor</text>
  <text x="100" y="106" class="white" font-size="13">neovim</text>

  <!-- shell -->
  <text x="24" y="128" class="purple bold" font-size="13">shell</text>
  <text x="100" y="128" class="white" font-size="13">bash</text>

  <!-- langs -->
  <text x="24" y="150" class="purple bold" font-size="13">langs</text>
  <text x="100" y="150" class="white" font-size="13">c  ·  c++  ·  python</text>

  <!-- tools -->
  <text x="24" y="172" class="purple bold" font-size="13">tools</text>
  <text x="100" y="172" class="white" font-size="13">vulkan  ·  g++  ·  docker</text>

  <!-- separator -->
  <text x="24" y="192" class="dim" font-size="14">─────────────────────────────────────────────</text>

  <!-- projects -->
  <text x="24" y="214" font-size="13"><tspan class="yellow bold">vaeron</tspan><tspan x="100" class="white">C++ game engine on Vulkan</tspan><tspan class="dim"> [WIP]</tspan></text>

  <text x="24" y="236" class="yellow bold" font-size="13">geode</text>
  <text x="100" y="236" class="white" font-size="13">AutoDeafen-Linux · Geometry Dash</text>

  <text x="24" y="258" class="yellow bold" font-size="13">dots</text>
  <text x="100" y="258" font-size="13"><tspan class="white">snytex/nvim-config-files</tspan></text>

  <!-- color swatches -->
  <rect x="24"  y="292" width="12" height="12" rx="2" fill="#e06c75"/>
  <rect x="40"  y="292" width="12" height="12" rx="2" fill="#e5c07b"/>
  <rect x="56"  y="292" width="12" height="12" rx="2" fill="#98c379"/>
  <rect x="72"  y="292" width="12" height="12" rx="2" fill="#61afef"/>
  <rect x="88"  y="292" width="12" height="12" rx="2" fill="#c678dd"/>
  <rect x="104" y="292" width="12" height="12" rx="2" fill="#56b6c2"/>
</svg>
